name: Solar System Suite CI/CD

on:
  push:
    branches: [ CPU, develop ]
  pull_request:
    branches: [ CPU ]
  schedule:
    # Run nightly builds at 2 AM UTC
    - cron: '0 2 * * *'

env:
  BUILD_TYPE: Release
  INSTALL_PREFIX: ${{ github.workspace }}/install

jobs:
  # Build and test on multiple platforms
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Release, Debug]
        include:
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          - os: macos-latest
            cc: clang
            cxx: clang++
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential curl doxygen graphviz lcov
        
    - name: Install dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install cmake curl doxygen graphviz coreutils
        
    - name: Configure CMake
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_PREFIX }} \
          -DENABLE_TESTING=ON \
          -DENABLE_PROFILING=OFF
          
    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} -j$(nproc)
      
    - name: Install
      run: cmake --build build --target install
      
    - name: Run Unit Tests
      working-directory: build
      run: ctest -L "unit" --output-on-failure --timeout 60
      
    - name: Run Integration Tests
      working-directory: build
      run: ctest -L "integration" --output-on-failure --timeout 180
      
    - name: Run Performance Benchmarks
      working-directory: build
      run: ctest -L "benchmark" --output-on-failure --timeout 300
      continue-on-error: true  # Benchmarks may vary by system
      
    - name: Test Installation
      working-directory: ${{ env.INSTALL_PREFIX }}
      run: |
        ./solar_system_launcher --status
        ./bin/solar_system --help
        ./bin/solar_system_fetch --test-storage
        
    - name: Generate Documentation
      if: matrix.os == 'ubuntu-latest' && matrix.build_type == 'Release'
      run: |
        cd docs
        mkdir -p api
        doxygen Doxyfile
        
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.build_type }}
        path: |
          build/Testing/
          build/tests/benchmark_results/
          
    - name: Upload Documentation
      uses: actions/upload-artifact@v4
      if: matrix.os == 'ubuntu-latest' && matrix.build_type == 'Release'
      with:
        name: documentation
        path: docs/

  # Code quality checks
  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format cppcheck
        
    - name: Check code formatting
      run: |
        find lib apps -name "*.cpp" -o -name "*.h" | xargs clang-format --dry-run --Werror
        
    - name: Run static analysis
      run: |
        # Run cppcheck and capture output
        cppcheck --enable=all --suppress=missingInclude --suppress=missingIncludeSystem --suppress=unusedFunction lib/ apps/ 2>&1 | tee cppcheck_output.txt
        # Check for actual errors and warnings (not information messages)
        if grep -E "(error|warning):" cppcheck_output.txt; then
          echo "❌ cppcheck found errors or warnings"
          exit 1
        else
          echo "✅ cppcheck passed - no errors or warnings found"
        fi
        
    - name: Check for TODO/FIXME comments
      run: |
        if grep -r "TODO\|FIXME" lib/ apps/ --include="*.cpp" --include="*.h"; then
          echo "Found TODO/FIXME comments - please address before merging"
          exit 1
        fi

  # Security scanning
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run security scan
      uses: github/super-linter@v5
      env:
        DEFAULT_BRANCH: CPU
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Exclude auto-generated documentation folder
        FILTER_REGEX_EXCLUDE: docs/.*
        # Disable problematic linters that conflict with our standards
        VALIDATE_MARKDOWN: false
        VALIDATE_YAML: false
        VALIDATE_JSCPD: false
        VALIDATE_NATURAL_LANGUAGE: false
        VALIDATE_CLANG_FORMAT: false  # We have our own clang-format in code-quality job
        VALIDATE_CHECKOV: false       # Infrastructure as code scanning not needed
        VALIDATE_DOCKERFILE: false    # No Dockerfiles in this project
        VALIDATE_GITLEAKS: false      # Secrets scanning might be too aggressive
        VALIDATE_CPP: false           # cpplint has outdated rules (80 char limit, copyright requirements)
        VALIDATE_JAVASCRIPT_ES: false # Disable JS formatting - we'll use our own standards
        VALIDATE_JAVASCRIPT_STANDARD: false # Disable JS standard linting

  # Performance regression detection
  performance-regression:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download baseline performance data
      uses: actions/download-artifact@v4
      with:
        name: performance-baseline
        path: baseline/
      continue-on-error: true
      
    - name: Download current performance data
      uses: actions/download-artifact@v4
      with:
        name: test-results-ubuntu-latest-Release
        path: current/
        
    - name: Compare performance
      run: |
        if [ -f baseline/benchmark_results/simulation_performance.csv ]; then
          python3 scripts/compare_performance.py \
            baseline/benchmark_results/simulation_performance.csv \
            current/tests/benchmark_results/simulation_performance.csv
        else
          echo "No baseline data available - skipping regression check"
        fi

  # Deployment preparation
  prepare-release:
    runs-on: ubuntu-latest
    needs: [build-and-test, code-quality, security-scan]
    if: github.ref == 'refs/heads/CPU'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Create release package
      run: |
        mkdir -p release/solar_system_suite
        cp -r lib apps cmake docs CMakeLists.txt README.md release/solar_system_suite/
        cd release
        tar -czf solar_system_suite.tar.gz solar_system_suite/
        
    - name: Upload release package
      uses: actions/upload-artifact@v4
      with:
        name: release-package
        path: release/solar_system_suite.tar.gz

  # Nightly performance baseline update
  update-baseline:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Build and benchmark
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTING=ON
        cmake --build build -j$(nproc)
        cd build
        ctest -L "benchmark" --output-on-failure
        
    - name: Upload new baseline
      uses: actions/upload-artifact@v4
      with:
        name: performance-baseline
        path: build/tests/benchmark_results/
        retention-days: 30

  # Documentation deployment
  deploy-docs:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/CPU'
    
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    
    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Download documentation
      uses: actions/download-artifact@v4
      with:
        name: documentation
        path: docs/
        
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
