name: Solar System Suite CI/CD

on:
  push:
    branches: [ modern-cpp-architecture, develop ]
  pull_request:
    branches: [ modern-cpp-architecture ]

env:
  BUILD_TYPE: Release
  INSTALL_PREFIX: ${{ github.workspace }}/install

jobs:
  # Code quality checks
  code-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format cppcheck

    - name: Check code formatting
      run: |
        find lib apps tests \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" \) -print0 | xargs -0 clang-format --dry-run --Werror

    - name: Run static analysis
      run: |
        cppcheck --enable=all --inline-suppr --suppress=missingInclude --suppress=missingIncludeSystem --suppress=unusedFunction lib/ apps/ 2>&1 | tee cppcheck_output.txt
        if grep -E "(error|warning):" cppcheck_output.txt; then
          echo "❌ cppcheck found errors or warnings"
          exit 1
        else
          echo "✅ cppcheck passed - no errors or warnings found"
        fi

  # Security scanning
  security-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run security scan
      uses: github/super-linter@v5
      env:
        DEFAULT_BRANCH: modern-cpp-architecture
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        FILTER_REGEX_EXCLUDE: docs/.*
        VALIDATE_MARKDOWN: false
        VALIDATE_YAML: false
        VALIDATE_JSCPD: false
        VALIDATE_NATURAL_LANGUAGE: false
        VALIDATE_CLANG_FORMAT: false
        VALIDATE_CHECKOV: false
        VALIDATE_DOCKERFILE: false
        VALIDATE_GITLEAKS: false
        VALIDATE_CPP: false
        VALIDATE_JAVASCRIPT_ES: false
        VALIDATE_JAVASCRIPT_STANDARD: false
        VALIDATE_PYTHON_BLACK: false
        VALIDATE_PYTHON_FLAKE8: false
        VALIDATE_PYTHON_ISORT: false
        VALIDATE_PYTHON_MYPY: false
        VALIDATE_PYTHON_PYLINT: false

  # TEMPORARILY DISABLED JOBS:
  # - build-and-test (Ubuntu/macOS, Release/Debug)
  # - performance-regression
  # - prepare-release
  # - update-baseline
  # - deploy-docs
