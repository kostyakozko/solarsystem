name: Solar System Suite CI/CD

on:
  push:
    branches: [ modern-cpp-architecture, develop ]
  pull_request:
    branches: [ modern-cpp-architecture ]
  schedule:
    - cron: '0 2 * * *'

env:
  BUILD_TYPE: Release
  INSTALL_PREFIX: ${{ github.workspace }}/install

jobs:
  # Build and test on multiple platforms
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Release, Debug]
        shared_libs: [OFF]
        include:
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          - os: macos-latest
            cc: clang
            cxx: clang++

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential curl doxygen graphviz lcov libssl-dev libcurl4-openssl-dev zlib1g-dev libboost-dev

    - name: Install dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install cmake curl doxygen graphviz coreutils openssl boost

    - name: Configure CMake
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}
        GITHUB_ACTIONS: true
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_PREFIX }} \
          -DBUILD_SHARED_LIBS=${{ matrix.shared_libs }} \
          -DENABLE_TESTING=ON \
          -DENABLE_PROFILING=OFF

    - name: Build
      run: |
        if [ "$RUNNER_OS" == "macOS" ]; then
          cmake --build build --config ${{ matrix.build_type }} -j"$(sysctl -n hw.ncpu)"
        else
          cmake --build build --config ${{ matrix.build_type }} -j"$(nproc)"
        fi

    - name: Install
      run: cmake --build build --target install

    - name: Run Unit Tests
      working-directory: build
      run: ctest -L "unit" --output-on-failure --timeout 60

    - name: Run Integration Tests
      working-directory: build
      run: ctest -L "integration" --output-on-failure --timeout 180

    - name: Run Performance Benchmarks
      working-directory: build
      run: ctest -L "benchmark" --output-on-failure --timeout 300
      continue-on-error: true

    - name: Test Installation
      working-directory: ${{ env.INSTALL_PREFIX }}
      run: |
        ./solar_system_launcher --status
        ./bin/solar_system --help
        ./bin/solar_system_fetch --test-storage

    - name: Generate Documentation
      if: matrix.os == 'ubuntu-latest' && matrix.build_type == 'Release'
      run: |
        cd docs
        mkdir -p api
        doxygen Doxyfile

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.build_type }}-static
        path: |
          build/Testing/
          build/tests/benchmark_results/

    - name: Upload Documentation
      uses: actions/upload-artifact@v4
      if: matrix.os == 'ubuntu-latest' && matrix.build_type == 'Release'
      with:
        name: documentation
        path: docs/

  # Code quality checks
  code-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format cppcheck

    - name: Check code formatting
      run: |
        find lib apps tests \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" \) -print0 | xargs -0 clang-format --dry-run --Werror

    - name: Run static analysis
      run: |
        cppcheck --enable=all --inline-suppr --suppress=missingInclude --suppress=missingIncludeSystem --suppress=unusedFunction lib/ apps/ 2>&1 | tee cppcheck_output.txt
        if grep -E "(error|warning):" cppcheck_output.txt; then
          echo "❌ cppcheck found errors or warnings"
          exit 1
        else
          echo "✅ cppcheck passed - no errors or warnings found"
        fi

  # Security scanning
  security-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run security scan
      uses: github/super-linter@v5
      env:
        DEFAULT_BRANCH: modern-cpp-architecture
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        FILTER_REGEX_EXCLUDE: docs/.*
        VALIDATE_MARKDOWN: false
        VALIDATE_YAML: false
        VALIDATE_JSCPD: false
        VALIDATE_NATURAL_LANGUAGE: false
        VALIDATE_CLANG_FORMAT: false
        VALIDATE_CHECKOV: false
        VALIDATE_DOCKERFILE: false
        VALIDATE_GITLEAKS: false
        VALIDATE_CPP: false
        VALIDATE_JAVASCRIPT_ES: false
        VALIDATE_JAVASCRIPT_STANDARD: false
        VALIDATE_PYTHON_BLACK: false
        VALIDATE_PYTHON_FLAKE8: false
        VALIDATE_PYTHON_ISORT: false
        VALIDATE_PYTHON_MYPY: false
        VALIDATE_PYTHON_PYLINT: false

  # Performance regression detection
  performance-regression:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download baseline performance data
      uses: actions/download-artifact@v4
      with:
        name: performance-baseline
        path: baseline/
      continue-on-error: true

    - name: Download current performance data
      uses: actions/download-artifact@v4
      with:
        name: test-results-ubuntu-latest-Release-static
        path: current/

    - name: Compare performance
      run: |
        if [ -f baseline/benchmark_results/simulation_performance.csv ]; then
          python3 scripts/compare_performance.py \
            baseline/benchmark_results/simulation_performance.csv \
            current/tests/benchmark_results/simulation_performance.csv
        else
          echo "No baseline data available - skipping regression check"
        fi

  # Deployment preparation
  prepare-release:
    runs-on: ubuntu-latest
    needs: [build-and-test, code-quality, security-scan]
    if: github.ref == 'refs/heads/modern-cpp-architecture'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create release package
      run: |
        mkdir -p release/solar_system_suite
        cp -r lib apps cmake docs CMakeLists.txt README.md release/solar_system_suite/
        cp requirements-*.txt release/solar_system_suite/ 2>/dev/null || true
        cp vcpkg.json release/solar_system_suite/ 2>/dev/null || true
        mkdir -p release/solar_system_suite/scripts
        cp scripts/*.sh release/solar_system_suite/scripts/ 2>/dev/null || true
        cd release
        tar -czf solar_system_suite.tar.gz solar_system_suite/

    - name: Upload release package
      uses: actions/upload-artifact@v4
      with:
        name: release-package
        path: release/solar_system_suite.tar.gz
        retention-days: 90

  # Nightly performance baseline update
  update-baseline:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build and benchmark
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTING=ON
        cmake --build build -j"$(nproc)"
        cd build
        ctest -L "benchmark" --output-on-failure

    - name: Upload new baseline
      uses: actions/upload-artifact@v4
      with:
        name: performance-baseline
        path: build/tests/benchmark_results/
        retention-days: 30
