version: '3.8'

services:
  solar-monitoring:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.monitoring
    ports:
      - "8080:8080"
    volumes:
      - solar-cache:/var/cache/solar_system
    environment:
      - SOLAR_LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  solar-cache:
