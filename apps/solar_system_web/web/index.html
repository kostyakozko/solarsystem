<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Suite - Time Travel Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            overflow: hidden;
        }
        
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 300;
            color: #4fc3f7;
            margin: 0;
        }
        
        .header .subtitle {
            font-size: 14px;
            color: #b0bec5;
            margin-top: 5px;
        }
        
        .controls {
            position: fixed;
            top: 80px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            min-width: 280px;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
        }
        
        .controls h3 {
            color: #4fc3f7;
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: 400;
        }
        
        .control-group {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .control-group:last-child {
            border-bottom: none;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            color: #b0bec5;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .control-group button {
            background: linear-gradient(135deg, #4fc3f7 0%, #29b6f6 100%);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            margin-right: 5px;
            margin-bottom: 5px;
            transition: all 0.3s ease;
        }
        
        .control-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 195, 247, 0.3);
        }
        
        .control-group button.active {
            background: linear-gradient(135deg, #ff7043 0%, #f4511e 100%);
        }
        
        .control-group input[type="date"],
        .control-group input[type="range"],
        .control-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 12px;
        }
        
        .control-group input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
        }
        
        .speed-display {
            text-align: center;
            margin: 10px 0;
            font-size: 14px;
            color: #4fc3f7;
            font-weight: bold;
        }
        
        .time-display {
            background: rgba(79, 195, 247, 0.1);
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            margin: 10px 0;
        }
        
        .time-display .current-time {
            font-size: 14px;
            color: #4fc3f7;
            font-weight: bold;
        }
        
        .time-display .time-info {
            font-size: 11px;
            color: #b0bec5;
            margin-top: 5px;
        }
        
        .status {
            position: fixed;
            top: 80px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            min-width: 200px;
        }
        
        .status h3 {
            color: #4fc3f7;
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: 400;
        }
        
        .status-item {
            margin-bottom: 10px;
            font-size: 12px;
        }
        
        .status-label {
            color: #b0bec5;
            display: inline-block;
            width: 80px;
        }
        
        .status-value {
            color: #ffffff;
            font-weight: 500;
        }
        
        .status-value.good {
            color: #4caf50;
        }
        
        .status-value.warning {
            color: #ff9800;
        }
        
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 2000;
        }
        
        .loading .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(79, 195, 247, 0.3);
            border-top: 3px solid #4fc3f7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .hidden {
            display: none;
        }
        
        .body-list {
            max-height: 150px;
            overflow-y: auto;
            margin-top: 10px;
        }
        
        .body-item {
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 11px;
        }
        
        .body-name {
            color: #4fc3f7;
            font-weight: 500;
        }
        
        .body-coords {
            color: #b0bec5;
            margin-top: 2px;
        }
        
        .preset-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 10px;
        }
        
        .preset-buttons button {
            flex: 1;
            min-width: 60px;
            font-size: 10px;
            padding: 6px 8px;
        }
        
        .label {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
            pointer-events: none;
            z-index: 100;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div>Loading Solar System...</div>
    </div>
    
    <div class="header">
        <h1>🌌 Solar System Suite - Time Travel</h1>
        <div class="subtitle">Interactive time-based visualization with orbital mechanics</div>
    </div>
    
    <div class="controls">
        <h3>⏰ Time Controls</h3>
        
        <div class="control-group">
            <label>Simulation Mode</label>
            <button id="btn-realtime" class="active">📡 Real-time</button>
            <button id="btn-simulation">🚀 Time Travel</button>
        </div>
        
        <div class="control-group" id="time-travel-controls" style="display: none;">
            <label>Start Date</label>
            <input type="date" id="start-date" value="2020-01-01">
            
            <div class="preset-buttons">
                <button onclick="setPresetDate('2020-01-01')">2020</button>
                <button onclick="setPresetDate('2010-01-01')">2010</button>
                <button onclick="setPresetDate('2000-01-01')">2000</button>
                <button onclick="setPresetDate('1990-01-01')">1990</button>
            </div>
            
            <label style="margin-top: 15px;">Simulation Speed</label>
            <input type="range" id="speed-slider" min="0" max="6" value="2" step="1">
            <div class="speed-display" id="speed-display">10x Speed</div>
            
            <button id="btn-start-simulation">🚀 Start Time Travel</button>
            <button id="btn-sync-realtime">📡 Sync to Real-time</button>
        </div>
        
        <div class="time-display">
            <div class="current-time" id="current-time">Loading...</div>
            <div class="time-info" id="time-info">Initializing...</div>
        </div>
        
        <h3>🎛️ Display</h3>
        
        <div class="control-group">
            <label>View Mode</label>
            <button id="btn-3d" class="active">3D View</button>
            <button id="btn-top">Top View</button>
        </div>
        
        <div class="control-group">
            <label>Visual Options</label>
            <button id="btn-orbits">🌀 Show Orbits</button>
            <button id="btn-labels">🏷️ Labels</button>
            <button id="btn-trails">✨ Orbit Trails</button>
        </div>
        
        <div class="control-group">
            <label>Animation</label>
            <button id="btn-play" class="active">▶️ Play</button>
            <button id="btn-pause">⏸️ Pause</button>
            <button id="btn-reset">🔄 Reset View</button>
        </div>
    </div>
    
    <div class="status">
        <h3>📊 Status</h3>
        
        <div class="status-item">
            <span class="status-label">Mode:</span>
            <span class="status-value" id="mode-status">Real-time</span>
        </div>
        
        <div class="status-item">
            <span class="status-label">Data:</span>
            <span class="status-value" id="data-status">Loading...</span>
        </div>
        
        <div class="status-item">
            <span class="status-label">Bodies:</span>
            <span class="status-value" id="body-count">-</span>
        </div>
        
        <div class="status-item">
            <span class="status-label">FPS:</span>
            <span class="status-value" id="fps">-</span>
        </div>
        
        <div class="status-item">
            <span class="status-label">Orbits:</span>
            <span class="status-value" id="orbit-points">0</span>
        </div>
        
        <div class="body-list" id="body-list">
            <!-- Body list will be populated by JavaScript -->
        </div>
    </div>
    
    <canvas id="canvas"></canvas>
    <div id="labels-container"></div>
    
    <script src="solar_system_timetravel.js"></script>
</body>
</html>
