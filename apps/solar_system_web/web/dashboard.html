<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Performance Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #1a1a2e; color: #eee; padding: 20px; }
    h1 { margin-bottom: 20px; color: #3282b8; }
    h2 { margin: 20px 0 10px; color: #0f4c75; }
    .cards { display: flex; gap: 20px; flex-wrap: wrap; }
    .card { background: #16213e; padding: 20px; border-radius: 8px; min-width: 200px; flex: 1; }
    .card h3 { margin: 0 0 10px; color: #0f4c75; font-size: 0.9em; text-transform: uppercase; }
    .card .value { font-size: 2.5em; font-weight: bold; color: #3282b8; }
    .card .unit { font-size: 0.5em; color: #888; margin-left: 4px; }
    .card .subtitle { font-size: 0.8em; color: #666; margin-top: 5px; }
    .alerts { margin-top: 30px; }
    .alert { padding: 12px 16px; margin: 8px 0; border-radius: 6px; display: flex; justify-content: space-between; }
    .alert.critical { background: #c0392b; }
    .alert.warning { background: #f39c12; color: #000; }
    .alert.info { background: #3498db; }
    .alert .metric { font-weight: bold; }
    .no-alerts { color: #666; font-style: italic; }
    .refresh { position: fixed; top: 20px; right: 20px; }
    .refresh button { background: #3282b8; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
    .refresh button:hover { background: #0f4c75; }
    #last-update { font-size: 0.8em; color: #666; margin-top: 5px; text-align: right; }
  </style>
</head>
<body>
  <h1>Performance Dashboard</h1>
  
  <div class="cards" id="cards">
    <div class="card">
      <h3>JPL API</h3>
      <div class="value"><span id="jpl-time">--</span><span class="unit">ms</span></div>
      <div class="subtitle">Avg Response Time</div>
    </div>
    <div class="card">
      <h3>Cache Hit Rate</h3>
      <div class="value"><span id="cache-rate">--</span><span class="unit">%</span></div>
      <div class="subtitle">Cache Efficiency</div>
    </div>
    <div class="card">
      <h3>Web FPS</h3>
      <div class="value"><span id="web-fps">--</span><span class="unit">fps</span></div>
      <div class="subtitle">Render Performance</div>
    </div>
    <div class="card">
      <h3>Simulation</h3>
      <div class="value"><span id="sim-steps">--</span><span class="unit">steps</span></div>
      <div class="subtitle">Total Timesteps</div>
    </div>
  </div>

  <div class="alerts">
    <h2>Alerts (<span id="alert-count">0</span>)</h2>
    <div id="alerts-container">
      <div class="no-alerts">No active alerts</div>
    </div>
  </div>

  <div class="refresh">
    <button onclick="refreshData()">Refresh</button>
    <div id="last-update"></div>
  </div>

  <script>
    async function refreshData() {
      try {
        const response = await fetch('/api/perf/metrics');
        const data = await response.json();
        
        document.getElementById('jpl-time').textContent = (data.jpl.avg_api_time * 1000).toFixed(1);
        document.getElementById('cache-rate').textContent = (data.cache.hit_rate * 100).toFixed(1);
        document.getElementById('web-fps').textContent = data.web.fps.toFixed(0);
        document.getElementById('sim-steps').textContent = data.simulation.total_timesteps;
        
        document.getElementById('last-update').textContent = 'Updated: ' + new Date().toLocaleTimeString();
      } catch (e) {
        console.error('Failed to fetch metrics:', e);
      }
      
      try {
        const alertsResponse = await fetch('/api/perf/alerts');
        const alertsData = await alertsResponse.json();
        
        document.getElementById('alert-count').textContent = alertsData.alerts.length;
        const container = document.getElementById('alerts-container');
        
        if (alertsData.alerts.length === 0) {
          container.innerHTML = '<div class="no-alerts">No active alerts</div>';
        } else {
          container.innerHTML = alertsData.alerts.map(a => 
            `<div class="alert ${a.severity}"><span class="metric">${a.metric}</span><span>${a.message}</span></div>`
          ).join('');
        }
      } catch (e) {
        console.error('Failed to fetch alerts:', e);
      }
    }
    
    // Initial load and auto-refresh every 5 seconds
    refreshData();
    setInterval(refreshData, 5000);
  </script>
</body>
</html>
